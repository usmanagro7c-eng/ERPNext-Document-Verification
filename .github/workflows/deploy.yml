name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare preset, mock off)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: wrangler-action@v3
        with:
          command: deploy -c wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: 55ced6868f059310735db3e9fe0eaf10
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
